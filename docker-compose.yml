name: mini-wsa


services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wsa
      POSTGRES_USER: wsa
      POSTGRES_PASSWORD: wsa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsa -d wsa"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - events:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wsa
    ports:
      - "${WSA_PORT:-8080}:8080"

volumes:
  events:
